services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 3s
      timeout: 5s
      retries: 10
    volumes:
      - umami-test-data:/var/lib/postgresql/data

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    environment:
      DATABASE_URL: postgresql://umami:umami@db:5432/umami
      APP_SECRET: integration-test-secret-key-12345
      DISABLE_TELEMETRY: "true"
    ports:
      - "${UMAMI_TEST_PORT:-3099}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/heartbeat || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  umami-test-data:
